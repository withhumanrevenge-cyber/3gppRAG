[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telcorag"
version = "1.0.0"
description = "Grounded question answering over 3GPP specifications with citation-level verification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
neural = ["sentence-transformers>=3.0", "torch>=2.2", "scikit-learn>=1.4"]
dev = ["pytest>=8.0"]

[project.scripts]
telcorag = "telcorag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
